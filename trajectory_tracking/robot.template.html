<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G1 机器人行走 · SONIC</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1821;color:#e6eef4;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1380px;margin:auto;padding:22px 20px 40px}h1{font-size:26px;margin:0 0 4px}p{color:#b3c4d0;margin:5px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:#dce8f0;border:1px solid #365063;background:#1b2c39;border-radius:6px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#1a749f;border-color:#379ed2;color:white}.player{position:relative}video{width:100%;max-height:76vh;aspect-ratio:16/9;display:block;background:#142a3b;border-radius:10px;object-fit:contain}#status{font-variant-numeric:tabular-nums}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}.tip{font-size:13px}a{color:#7fc8f0}.badge{display:inline-block;padding:3px 10px;border-radius:5px;background:#173a39;color:#9cddd0}#route-name{color:white;font-weight:500}@media(max-width:600px){main{padding:16px 10px}h1{font-size:21px}button{padding:6px 8px}video{max-height:none}}
</style></head><body><main>
<h1>G1 机器人在 10 条不同轨迹上行走</h1><p>原始 MuJoCo 物理仿真回放 · 镜头跟随 · 25 FPS · 黄线为规划路径</p>
<nav id="tabs" class="tabs" aria-label="选择行走路径"></nav>
<div class="player"><video id="video" controls autoplay muted playsinline loop preload="auto"></video></div>
<div class="controls"><span id="route-name"></span><button id="play">暂停</button><button id="restart">从头看起步</button><button id="stop">看终点停车</button><label>速度 <select id="rate"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="fullscreen">全屏</button><span id="status"></span></div>
<p id="result" class="badge"></p><p class="tip">默认从第6秒的行走阶段开始，可从头查看起步和最后实际站稳过程。机器人根部、双腿、双臂均来自原始仿真状态。</p>
<p class="tip">画面来源为 MuJoCo 物理仿真。<a href="/different-paths/">查看10条轨迹的完整误差图、双臂导出对比和50 Hz数据</a></p>
</main><script id="data" type="application/json">__DATA__</script><script>
'use strict';const routes=JSON.parse(document.getElementById('data').textContent),video=document.getElementById('video');let current=0,start=6;video.muted=true;const folder=r=>'trial-'+String(r.id).padStart(2,'0');
routes.forEach((r,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String(r.id).padStart(2,'0')+' '+r.label;b.onclick=()=>choose(i);b.setAttribute('aria-pressed','false');document.getElementById('tabs').appendChild(b);});
function choose(i){current=i;const r=routes[i];start=Math.min(6,r.duration/3);video.pause();document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.getElementById('route-name').textContent=r.label;document.getElementById('result').textContent='终点误差 '+r.final_cm.toFixed(2)+' cm · 朝向误差 '+r.heading_deg.toFixed(2)+'° · '+(r.completed?'已完成实际站稳':'未完成');video.src=folder(r)+'/robot.mp4';video.poster=folder(r)+'/robot-preview.jpg';video.load();}
video.addEventListener('loadedmetadata',()=>{video.currentTime=start;video.playbackRate=Number(document.getElementById('rate').value);video.play().catch(()=>document.getElementById('play').textContent='播放');});video.addEventListener('play',()=>document.getElementById('play').textContent='暂停');video.addEventListener('pause',()=>document.getElementById('play').textContent='播放');video.addEventListener('timeupdate',()=>document.getElementById('status').textContent=video.currentTime.toFixed(1)+' / '+(Number.isFinite(video.duration)?video.duration.toFixed(1):'—')+' s');document.getElementById('play').onclick=()=>video.paused?video.play():video.pause();document.getElementById('restart').onclick=()=>{video.currentTime=0;video.play();};document.getElementById('stop').onclick=()=>{video.currentTime=Math.max(0,routes[current].braking_start-1);video.play();};document.getElementById('rate').onchange=e=>video.playbackRate=Number(e.target.value);document.getElementById('fullscreen').onclick=()=>video.requestFullscreen?video.requestFullscreen():video.webkitEnterFullscreen&&video.webkitEnterFullscreen();choose(0);
</script></body></html>
